# validate — .coderabbit.yaml against CodeRabbit's published schema, on every PR.
# No on:-level path filter: this is the repo's required check (the fleet's
# required-check deadlock rule).
name: validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml jsonschema
      - run: python3 ci/validate.py
