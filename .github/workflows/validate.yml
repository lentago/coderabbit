# validate — .coderabbit.yaml against CodeRabbit's published schema, on every PR.
# No on:-level path filter: this is the repo's required check (the fleet's
# required-check deadlock rule).
name: validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml jsonschema
      - run: python3 ci/validate.py
