# validate — .coderabbit.yaml against CodeRabbit's published schema, on every PR.
# No on:-level path filter: this is the repo's required check (the fleet's
# required-check deadlock rule).
name: validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml jsonschema
      - run: python3 ci/validate.py
